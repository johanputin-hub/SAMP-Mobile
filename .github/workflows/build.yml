name: Build client APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fix dead library repository and version
        run: |
          grep -rl "PRDownloader:1.0.1" --include=*.gradle . | xargs sed -i 's/PRDownloader:1.0.1/PRDownloader:1.0.2/'
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              p.repositories.removeAll { it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && it.url.toString().contains('splunk') }
              p.repositories.maven { url 'https://jitpack.io' }
            }
          }
          EOF
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: app/build/outputs/apk/**/*.apk
