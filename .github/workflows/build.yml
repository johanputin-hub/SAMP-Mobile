name: Build client APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fix upper/lower case in include names
        run: |
          python3 - <<'EOF'
          import os, re
          root = 'app/src/main/cpp'
          files = []
          for d, _, fs in os.walk(root):
              for f in fs:
                  files.append(os.path.join(d, f).replace('\\', '/'))
          exact, lower = set(), {}
          for f in files:
              parts = f.split('/')
              for i in range(len(parts)):
                  s = '/'.join(parts[i:])
                  exact.add(s)
                  lower.setdefault(s.lower(), s)
          pat = re.compile(r'(#\s*include\s*["<])([^">]+)([">])')
          fixed = 0
          for f in files:
              if not f.endswith(('.h', '.hpp', '.c', '.cc', '.cpp', '.inc')):
                  continue
              try:
                  src = open(f, encoding='utf-8', errors='surrogateescape').read()
              except Exception:
                  continue
              def sub(m):
                  global fixed
                  n = m.group(2).replace('\\', '/')
                  mm = re.match(r'^((?:\.\./|\./)*)(.*)$', n)
                  prefix, rest = mm.group(1), mm.group(2)
                  if rest in exact:
                      return m.group(0)
                  actual = lower.get(rest.lower())
                  if actual:
                      fixed += 1
                      return m.group(1) + prefix + actual + m.group(3)
                  return m.group(0)
              new = pat.sub(sub, src)
              if new != src:
                  open(f, 'w', encoding='utf-8', errors='surrogateescape').write(new)
          print('::notice title=CASE FIXES::' + str(fixed) + ' include names fixed')
          EOF
      - name: Fix dead library repository and version
        run: |
          grep -rl "PRDownloader:1.0.1" --include=*.gradle . | xargs sed -i 's/PRDownloader:1.0.1/PRDownloader:1.0.2/'
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              p.repositories.removeAll { it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && it.url.toString().contains('splunk') }
              p.repositories.maven { url 'https://jitpack.io' }
            }
          }
          EOF
      - name: Use debug signing key
        run: |
          python3 - <<'EOF'
          import re
          p = 'app/build.gradle'
          s = open(p).read()
          m = re.search(r'signingConfigs\s*\{', s)
          if m:
              i = m.end(); depth = 1
              while depth and i < len(s):
                  depth += (s[i] == '{') - (s[i] == '}')
                  i += 1
              s = s[:m.start()] + s[i:]
          s = re.sub(r'(?m)^\s*signingConfig\s*=?\s*signingConfigs\..*$', '', s)
          open(p, 'w').write(s)
          EOF
          grep -n -i "signing\|keystore\|storeFile" app/build.gradle || echo "no signing lines left"
      - run: chmod +x gradlew
      - name: Build
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            E=$(grep -E "fatal error|error:|undefined reference|What went wrong|Could not|not found" -A1 build.log | grep -v "^--" | head -12 | cut -c1-230 | tr '\n' '|')
            echo "::error title=BUILD ERROR::${E}"
          fi
          exit $RC
      - uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: app/build/outputs/apk/**/*.apk
